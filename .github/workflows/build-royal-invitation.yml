name: Build royal emerald invitation
on:
  push:
    branches: [main]
    paths:
      - 'royal-emerald-invitation/**'
      - '.github/workflows/build-royal-invitation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: royal-emerald-invitation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: royal-emerald-invitation/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build invitation
        run: npm run build
      - name: Publish built files into Pages subdirectory
        working-directory: .
        run: |
          rm -rf royal-emerald-invitation/assets
          cp -R royal-emerald-invitation/dist/. royal-emerald-invitation/
          rm -rf royal-emerald-invitation/dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add royal-emerald-invitation/index.html royal-emerald-invitation/assets
          if ! git diff --cached --quiet; then
            git commit -m "Build royal emerald invitation for GitHub Pages"
            git push
          fi
